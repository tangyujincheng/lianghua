[tool]
poetry = "poetry>=1.5.0"
click = "^8.0"

[project]
name = "lianghua"
version = "0.1.0"
description = "A modular quantitative trading system"
authors = []
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "pymongo>=4.3.0",
    "aiohttp>=3.8.0",
    "tushare>=1.2.73",
    "akshare>=1.7.0",
    "yfinance>=0.2.18",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "numba>=0.57.0",
    "joblib>=1.2.0",
    "click>=8.1.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.0"
pytest-cov = "^4.0.0"
black = "^23.3.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"
